<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ShreeLaxmi — Project UI</title>
  <style>
    body { background:#0b0f12; color:#e6eef6; font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; margin:0; }
    .wrap{max-width:1100px;margin:36px auto;padding:24px}
    .card{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border-radius:12px;padding:18px}
    img{display:block;max-width:100%;height:auto;border-radius:8px;box-shadow:0 8px 30px rgba(0,0,0,0.6)}
    .links{margin-top:12px}
    a{color:#9be7c4;text-decoration:none}
    .iframe{width:100%;height:720px;border:0;border-radius:8px;box-shadow:0 12px 40px rgba(0,0,0,0.6);margin-top:18px}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>ShreeLaxmi — Project UI</h1>
    <div class="card">
      <p>Preview screenshot (below) and live preview (iframe). Use the links to open the live project or its source.</p>
      <img src="/images/laxmi-website.png" alt="ShreeLaxmi screenshot">
      <div class="links">
        <a href="https://laxmi-website.vercel.app/" target="_blank" rel="noreferrer">Open live project</a>
        <br />
        <a href="https://sony12-grg.github.io/Cocktail-repo/" target="_blank" rel="noreferrer">Open Cocktail demo</a>
      </div>
    </div>
  </div>
</body>
</html>
